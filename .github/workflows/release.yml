name: Release

# Builds binaries for every platform and uploads them to the GitHub release
# for the pushed tag. The release may already exist (created manually or by a
# previous run) — `gh release upload` only appends assets, so this works either
# way and never blocks on goreleaser creating the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG zaten var; atlanıyor."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  linux-amd64:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install Linux deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev pkg-config gcc
      - name: Build (make build)
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: make build VERSION="${RAW#v}"
      - name: Package
        run: |
          mkdir -p build/musicle-cli_Linux_x86_64
          cp build/musicle-cli build/musicle-cli_Linux_x86_64/musicle-cli
          cp README.md build/musicle-cli_Linux_x86_64/ 2>/dev/null || true
          cd build && tar czf musicle-cli_Linux_x86_64.tar.gz musicle-cli_Linux_x86_64
      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run:           gh release upload --clobber "$TAG" build/musicle-cli_Linux_x86_64.tar.gz

  linux-arm64:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Build linux/arm64 via QEMU
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/build" -w /build \
            -e CGO_ENABLED=1 \
          arm64v8/ubuntu:24.04 /bin/bash -c "
            apt-get update -qq && apt-get install -y -qq ca-certificates libasound2-dev curl gcc pkg-config
            curl -sL https://go.dev/dl/go1.26.1.linux-arm64.tar.gz -o /tmp/go.tgz
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH=/usr/local/go/bin:\$PATH
            ./scripts/prepare-engine.sh linux
            go build -tags engine_assets -ldflags='-s -w -X main.version=${RAW#v} -X main.commit=${{ github.sha }} -X main.date=\$(date -u +%Y-%m-%d)' \
              -o musicle-cli-linux-arm64 .
          "
      - name: Package archive
        run: |
          mkdir -p build/musicle-cli_Linux_arm64
          cp musicle-cli-linux-arm64 build/musicle-cli_Linux_arm64/musicle-cli
          cp README.md build/musicle-cli_Linux_arm64/ 2>/dev/null || true
          cd build && tar czf musicle-cli_Linux_arm64.tar.gz musicle-cli_Linux_arm64
      - name: Upload artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run:           gh release upload --clobber "$TAG" build/musicle-cli_Linux_arm64.tar.gz

  windows:
    needs: create-release
    strategy:
      matrix:
        arch: [amd64, "386", arm64]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Prepare engine (windows)
        run: ./scripts/prepare-engine.sh windows
      - name: Build
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          go build -tags engine_assets \
            -ldflags="-s -w -X main.version=${RAW#v} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%d)" \
            -o musicle-cli-windows-${{ matrix.arch }}.exe .
      - name: Package archive
        run: |
          mkdir -p build/musicle-cli_Windows_${{ matrix.arch }}
          cp musicle-cli-windows-${{ matrix.arch }}.exe build/musicle-cli_Windows_${{ matrix.arch }}/
          cp README.md build/musicle-cli_Windows_${{ matrix.arch }}/ 2>/dev/null || true
          cd build && tar czf musicle-cli_Windows_${{ matrix.arch }}.tar.gz musicle-cli_Windows_${{ matrix.arch }}
      - name: Upload artifacts (.exe + archive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload --clobber "$TAG" musicle-cli-windows-${{ matrix.arch }}.exe
          gh release upload --clobber "$TAG" build/musicle-cli_Windows_${{ matrix.arch }}.tar.gz

  appimage:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfuse2 desktop-file-utils
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
      - name: Prepare engine (linux)
        run: ./scripts/prepare-engine.sh linux
      - name: Build binary
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CGO_ENABLED=1 go build -tags engine_assets \
            -ldflags="-s -w -X main.version=${RAW#v} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%d)" \
            -o musicle-cli-linux-x86_64.AppDir/usr/bin/musicle-cli .
      - name: Prepare AppDir
        run: |
          APPDIR=musicle-cli-linux-x86_64.AppDir
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/1024x1024/apps"
          mkdir -p "$APPDIR/usr/share/metainfo"

          cat > "$APPDIR/io.anomalyco.musicle-cli.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=MusicLe
          Comment=Terminal music player with playlist management and audio visualization
          Exec=musicle-cli
          Icon=io.anomalyco.musicle-cli
          Terminal=true
          Type=Application
          Categories=Audio;Music;Player;
          StartupNotify=false
          DESKTOP
          cp "$APPDIR/io.anomalyco.musicle-cli.desktop" "$APPDIR/usr/share/applications/"

          cp assets/MusicLe.png "$APPDIR/usr/share/icons/hicolor/1024x1024/apps/io.anomalyco.musicle-cli.png"
          cp assets/MusicLe.png "$APPDIR/io.anomalyco.musicle-cli.png"

          desktop-file-validate "$APPDIR/io.anomalyco.musicle-cli.desktop"
      - name: Build AppImage
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ./appimagetool -n musicle-cli-linux-x86_64.AppDir \
            "musicle-cli_${RAW#v}_x86_64.AppImage"
      - name: Upload AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run:           gh release upload --clobber "$TAG" musicle-cli_*.AppImage

  macos-intel:
    needs: create-release
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Prepare engine (darwin)
        run: ./scripts/prepare-engine.sh darwin
      - name: Build macOS (amd64)
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -tags engine_assets \
            -ldflags="-s -w -X main.version=${RAW#v} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%d)" \
            -o musicle-cli-darwin-amd64 .
      - name: Package archive
        run: |
          mkdir -p build/musicle-cli_macOS_x86_64
          cp musicle-cli-darwin-amd64 build/musicle-cli_macOS_x86_64/musicle-cli
          cp README.md build/musicle-cli_macOS_x86_64/ 2>/dev/null || true
          cd build && tar czf musicle-cli_macOS_x86_64.tar.gz musicle-cli_macOS_x86_64 && cd ..
      - name: Package .app bundle
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          APP="build/MusicLe.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp musicle-cli-darwin-amd64 "$APP/Contents/MacOS/musicle-cli"
          cp assets/MusicLe.png "$APP/Contents/Resources/" 2>/dev/null || true
          sips -s format icns assets/MusicLe.png --out "$APP/Contents/Resources/MusicLe.icns" 2>/dev/null || true
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>MusicLeLauncher</string>
            <key>CFBundleIdentifier</key>
            <string>com.musicle.cli</string>
            <key>CFBundleName</key>
            <string>MusicLe</string>
            <key>CFBundleVersion</key>
            <string>${RAW#v}</string>
            <key>CFBundleShortVersionString</key>
            <string>${RAW#v}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>MusicLe</string>
          </dict>
          </plist>
          PLIST
          cat > "$APP/Contents/MacOS/MusicLeLauncher" <<'LAUNCHER'
          #!/bin/sh
          # TUI apps need a real terminal: open one running the binary.
          HERE="$(cd "$(dirname "$0")" && pwd)"
          open -a Terminal "$HERE/musicle-cli"
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/MusicLeLauncher" "$APP/Contents/MacOS/musicle-cli"
          cd build && rm -f MusicLe-macOS-x86_64.zip && zip -qr MusicLe-macOS-x86_64.zip MusicLe.app && cd ..
      - name: Upload artifacts (.app + archive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload --clobber "$TAG" build/MusicLe-macOS-x86_64.zip
          gh release upload --clobber "$TAG" build/musicle-cli_macOS_x86_64.tar.gz

  macos-arm:
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Prepare engine (darwin)
        run: ./scripts/prepare-engine.sh darwin
      - name: Build macOS (arm64)
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -tags engine_assets \
            -ldflags="-s -w -X main.version=${RAW#v} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%d)" \
            -o musicle-cli-darwin-arm64 .
      - name: Package archive
        run: |
          mkdir -p build/musicle-cli_macOS_arm64
          cp musicle-cli-darwin-arm64 build/musicle-cli_macOS_arm64/musicle-cli
          cp README.md build/musicle-cli_macOS_arm64/ 2>/dev/null || true
          cd build && tar czf musicle-cli_macOS_arm64.tar.gz musicle-cli_macOS_arm64 && cd ..
      - name: Package .app bundle
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          APP="build/MusicLe.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp musicle-cli-darwin-arm64 "$APP/Contents/MacOS/musicle-cli"
          cp assets/MusicLe.png "$APP/Contents/Resources/" 2>/dev/null || true
          sips -s format icns assets/MusicLe.png --out "$APP/Contents/Resources/MusicLe.icns" 2>/dev/null || true
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>MusicLeLauncher</string>
            <key>CFBundleIdentifier</key>
            <string>com.musicle.cli</string>
            <key>CFBundleName</key>
            <string>MusicLe</string>
            <key>CFBundleVersion</key>
            <string>${RAW#v}</string>
            <key>CFBundleShortVersionString</key>
            <string>${RAW#v}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>MusicLe</string>
          </dict>
          </plist>
          PLIST
          cat > "$APP/Contents/MacOS/MusicLeLauncher" <<'LAUNCHER'
          #!/bin/sh
          # TUI apps need a real terminal: open one running the binary.
          HERE="$(cd "$(dirname "$0")" && pwd)"
          open -a Terminal "$HERE/musicle-cli"
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/MusicLeLauncher" "$APP/Contents/MacOS/musicle-cli"
          cd build && rm -f MusicLe-macOS-arm64.zip && zip -qr MusicLe-macOS-arm64.zip MusicLe.app && cd ..
      - name: Upload artifacts (.app + archive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload --clobber "$TAG" build/MusicLe-macOS-arm64.zip
          gh release upload --clobber "$TAG" build/musicle-cli_macOS_arm64.tar.gz
